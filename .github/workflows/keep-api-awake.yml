name: keep-api-awake

# Render's free web service sleeps after 15 minutes without traffic, and the first request after
# that takes up to a minute. A request to /healthz every 10 minutes keeps it awake. To save the
# free instance hours it only runs on weekdays from 08:00 to 18:00 IST (02:30 to 12:30 UTC). That
# is the same weekday in both time zones, so the day field needs no conversion. GitHub may start a
# scheduled run a few minutes late. Outside these hours the API sleeps and the sign-in form waits
# for it to wake. Run it by hand from the Actions tab (workflow_dispatch) before a demo.
#
# To turn it off: Actions tab, keep-api-awake, "..." menu, Disable workflow (or delete this file).

on:
  schedule:
    - cron: "30,40,50 2 * * 1-5" # 02:30 to 02:50 UTC
    - cron: "*/10 3-11 * * 1-5" # 03:00 to 11:50 UTC
    - cron: "0,10,20,30 12 * * 1-5" # 12:00 to 12:30 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /healthz
        run: |
          # A cold instance can take about a minute: wait for it, and try a few times.
          curl --silent --show-error --fail --retry 4 --retry-delay 15 --retry-all-errors \
            --max-time 90 https://syncspace-api-latest.onrender.com/healthz
          echo
