name: nightly property tests

# High-volume random exploration of the hostile-input property tests in sync-crdt. Pull
# requests run the same tests with a fixed seed and 10 000 cases (see ci.yml), so a PR can
# never fail by luck. This job uses a new seed every night, and a failure opens an issue
# instead of blocking anyone. Saved failing cases go into
# crates/sync-crdt/tests/convergence.proptest-regressions, which replays them on every run.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Proptest RNG seed (default: the run id). Use it to reproduce a failure."
        required: false
      cases:
        description: "Cases per property test (default 200000)"
        required: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: never
  # Values from the dispatch form go through env, never straight into a script.
  PROPTEST_CASES: ${{ inputs.cases || '200000' }}
  PROPTEST_RNG_SEED: ${{ inputs.seed || github.run_id }}

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Run the property tests in release mode
        shell: bash
        run: |
          set -o pipefail
          # Release builds differ from debug (no debug_assert, wrapping overflow), and they are
          # what ships. The timeout turns a hang into a failure (exit status 124).
          timeout 3000 cargo test -p sync-crdt --release --test convergence 2>&1 | tee proptest.log
      - name: Open an issue when a property test fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "The nightly property tests failed."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Seed: \`${PROPTEST_RNG_SEED}\`, cases per test: \`${PROPTEST_CASES}\`"
            echo
            echo "Reproduce locally:"
            echo
            echo '```'
            echo "PROPTEST_RNG_SEED=${PROPTEST_RNG_SEED} PROPTEST_CASES=${PROPTEST_CASES} \\"
            echo "  cargo test -p sync-crdt --release --test convergence"
            echo '```'
            echo
            echo "Failing lines (proptest also saved the case to \`convergence.proptest-regressions\` on the runner; copy the \`cc\` line from the log into the repo):"
            echo
            echo '```'
            grep -E "^test .*FAILED|panicked at|minimal failing input|^cc |shrinks to|has been running for over" proptest.log | head -40 || true
            echo '```'
            echo
            echo "A run that hangs shows up here as the 3000 s timeout (no test output after the last line)."
          } > issue.md
          gh issue create --title "Nightly property tests failed (run ${GITHUB_RUN_ID})" --body-file issue.md
