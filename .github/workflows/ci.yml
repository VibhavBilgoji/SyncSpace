name: ci

on:
  # Pull requests are covered by the pull_request event; running push on every branch too
  # would run each PR twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO(phase 1): add a mongo:7 service and MONGODB_URI once integration tests need it.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - run: wasm-pack test --node crates/sync-crdt
      # TODO(phase 1): cargo llvm-cov -p sync-crdt --fail-under-lines 90
      # TODO(phase 1): cargo llvm-cov -p server --fail-under-lines 75

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      # The generated package is imported by the app, so lint and typecheck need it.
      - run: pnpm --dir apps/web wasm
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      # TODO(phase 1): pnpm --dir apps/web test --coverage (70% on src/lib and src/components)
      # TODO(phase 1): cargo run -p server --bin gen-types && git diff --exit-code apps/web/src/types/generated

  e2e:
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The spike relay is started by Playwright (see e2e/playwright.config.ts).
    # TODO(phase 1): mongo:7 service, and start the real API instead of the relay.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web wasm
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e typecheck
      - run: pnpm --dir e2e exec playwright install --with-deps chromium firefox
      - run: pnpm --dir e2e test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
