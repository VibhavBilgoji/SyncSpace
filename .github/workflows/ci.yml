name: ci

on:
  # Pull requests are covered by the pull_request event; running push on every branch too
  # would run each PR twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The server integration tests need a real MongoDB. Same major version as Atlas free
    # clusters (8.0) and as infrastructure/docker-compose.yml; see docs/DEPLOYMENT.md.
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The TypeScript types of the API are generated from the Rust structs and committed. Regenerate
      # and fail when anything differs (a changed file) or appears (a new file `git diff` misses).
      - name: generated TypeScript types are up to date
        run: |
          cargo run -p server --bin gen-types
          git diff --exit-code -- apps/web/src/types/generated
          untracked=$(git status --porcelain --untracked-files=all -- apps/web/src/types/generated)
          if [ -n "$untracked" ]; then
            echo "::error::apps/web/src/types/generated is stale; run 'cargo run -p server --bin gen-types' and commit the result"
            echo "$untracked"
            exit 1
          fi
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace --no-fail-fast 2>&1 | tee test.log; then
            # Show the failing tests as annotations, so they are visible without opening the log.
            grep -E "^test .* FAILED|panicked at|^ *(left|right):|assertion" test.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      # Release builds differ from debug: no debug_assert, and wrapping overflow unless it is
      # switched on for yrs (see [profile.release.package.yrs] in Cargo.toml). They are what
      # ships, so the hostile-input tests must pass there too. The seed is fixed, so this step
      # cannot fail by luck; the nightly workflow explores new seeds.
      - run: cargo test -p sync-crdt --release --test convergence --test parity --test blocks --test block_parity
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1,cargo-llvm-cov@0.9.1
      - run: wasm-pack test --node crates/sync-crdt
      # Coverage gates (docs/TESTING.md section 3): line coverage of the native build. The
      # Wasm half of sync-crdt is tested by `wasm-pack test`, which llvm-cov cannot measure.
      # The property tests run 500 cases here: the percentage does not depend on the case
      # count, and the full runs are in `cargo test` above and in the nightly workflow. A
      # threshold that is not met fails the step. The server step needs the mongo service.
      - run: bash .github/scripts/coverage-gate.sh sync-crdt 90
        env:
          PROPTEST_CASES: "500"
      - run: bash .github/scripts/coverage-gate.sh server 75

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      # The generated package is imported by the app, so lint and typecheck need it.
      - run: pnpm --dir apps/web wasm
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      # TODO(phase 1): pnpm --dir apps/web test --coverage (70% on src/lib and src/components)
      # The generated-types staleness check runs in the `rust` job (it needs the Rust toolchain only).

  e2e:
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The spike relay is started by Playwright (see e2e/playwright.config.ts).
    # TODO(phase 1): mongo:8.0 service, and start the real API instead of the relay.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web wasm
      # Built here so that Playwright's 300 s start-up wait is not spent compiling.
      - run: cargo build -p server
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e typecheck
      - run: pnpm --dir e2e exec playwright install --with-deps chromium firefox
      - run: pnpm --dir e2e test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
