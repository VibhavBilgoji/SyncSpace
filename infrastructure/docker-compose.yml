services:
  mongo:
    # The MongoDB major version that Atlas free clusters run. Keep it identical in the CI
    # service container (.github/workflows/ci.yml), docs/DEPLOYMENT.md and the version guard in
    # crates/server/tests/db_indexes.rs; change all of them together.
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
