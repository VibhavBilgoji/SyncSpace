[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"

# `yrs` is pinned with an exact version (CLAUDE.md rule 6): the native server and
# the Wasm build must use the same release. Bump it in one place, in one change.
[workspace.dependencies]
yrs = "=0.28.1"
thiserror = "2"
wasm-bindgen = "=0.2.130"
wasm-bindgen-test = "0.3.80"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
proptest = "1"
mongodb = "3.10"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["cors", "trace", "catch-panic"] }
dotenvy = "0.15"
argon2 = "0.6"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
base64 = "0.23"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = "12"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Yrs 0.28.1 does unchecked u32 subtraction while integrating an update (block_store.rs:320).
# A hostile update makes it overflow: debug builds panic, but release builds wrap silently and
# return Ok with a corrupt document, and one release run of the mutation test hung. Keep the
# overflow check on for yrs in release so the overflow is an ordinary panic, which
# SpikeDoc::apply_update turns into an error. This also applies to the Wasm release build.
[profile.release.package.yrs]
overflow-checks = true

# Dependencies (not the workspace crates) are optimised in debug builds: Yrs does a lot of work
# per update, and the property tests of `sync-crdt` run it thousands of times. Debug assertions
# and overflow checks stay on, so the hostile-input tests still exercise them.
[profile.dev.package."*"]
opt-level = 2

# Argon2 at the OWASP cost (19 MiB, 2 passes) is far too slow without optimisation, and every test
# that registers or logs in a user pays for it. The two hashing crates get the highest level.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
